[pytest]
# Scope collection to the unit-test suite. benchmark/tests/machine_test.py is a
# standalone integration script (run via `make test <category> <task_type>
# <vm>`), not a pytest module: it parses argv and calls sys.exit() at import,
# which aborts a bare `pytest` run with an INTERNALERROR because its name also
# matches pytest's default `*_test.py` collection pattern. Explicit paths still
# work (`pytest tests`, `make test-unit`).
testpaths = tests
addopts = -ra
