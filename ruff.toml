# Static-analysis configuration for the benchmark sources.
target-version = "py310"
line-length = 100

[lint]
select = ["E", "F", "W", "I", "B", "SIM", "UP", "RUF"]
ignore = [
    # The harness deliberately catches broad exceptions at its boundaries
    # (channel reads, LLM calls, subprocess orchestration) and turns them into
    # agent observations, retries, or clear setup errors. Narrowing these to
    # specific types would defeat that design.
    "BLE001",
]

[lint.isort]
# modules that live next to the code importing them: the package itself and
# the test helpers in tests/support.py
known-first-party = ["autopenbench", "support"]
