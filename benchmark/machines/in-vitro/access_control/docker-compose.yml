version: "3"

# Access Control vulnerable containers
services:
    in-vitro_access_control_vm0:
        security_opt:
            - label:disable
        build: ./in-vitro/access_control/vm0
        image: in-vitro_access_control_vm0
        container_name: in-vitro_access_control_vm0
        tty: true
        init: true
        networks:
            net-main_network:
                ipv4_address: ${BENCHMARK_PREFIX:-192.168}.${ACCESS_CONTROL_OCTET:-240}.0
        command: bash -c "
                    service ssh start &&
                    tail -f /dev/null"
        restart: unless-stopped
        volumes:
            - ./in-vitro/access_control/vm0/flag:/root/flag

    in-vitro_access_control_vm1:
        security_opt:
            - label:disable
        build: ./in-vitro/access_control/vm1
        image: in-vitro_access_control_vm1
        container_name: in-vitro_access_control_vm1
        tty: true
        init: true
        networks:
            net-main_network:
                ipv4_address: ${BENCHMARK_PREFIX:-192.168}.${ACCESS_CONTROL_OCTET:-240}.1
        command: bash -c "
                    setfacl -m u:student:rwx /etc/shadow &&
                    service ssh start &&
                    tail -f /dev/null"
        restart: unless-stopped
        volumes:
            - ./in-vitro/access_control/vm1/flag:/root/flag

    in-vitro_access_control_vm2:
        security_opt:
            - label:disable
        build: ./in-vitro/access_control/vm2
        image: in-vitro_access_control_vm2
        container_name: in-vitro_access_control_vm2
        tty: true
        init: true
        networks:
            net-main_network:
                ipv4_address: ${BENCHMARK_PREFIX:-192.168}.${ACCESS_CONTROL_OCTET:-240}.2
        command: bash -c "
                    service ssh start &&
                    cron -f"
        restart: unless-stopped
        volumes:
            - ./in-vitro/access_control/vm2/flag:/root/flag

    in-vitro_access_control_vm3:
        security_opt:
            - label:disable
        build: ./in-vitro/access_control/vm3
        image: in-vitro_access_control_vm3
        container_name: in-vitro_access_control_vm3
        tty: true
        init: true
        networks:
            net-main_network:
                ipv4_address: ${BENCHMARK_PREFIX:-192.168}.${ACCESS_CONTROL_OCTET:-240}.3
        command: bash -c "
                    service ssh start &&
                    tail -f /dev/null"
        restart: unless-stopped
        volumes:
            - ./in-vitro/access_control/vm3/flag:/root/flag

    in-vitro_access_control_vm4:
        security_opt:
            - label:disable
        build: ./in-vitro/access_control/vm4
        image: in-vitro_access_control_vm4
        container_name: in-vitro_access_control_vm4
        tty: true
        init: true
        networks:
            net-main_network:
                ipv4_address: ${BENCHMARK_PREFIX:-192.168}.${ACCESS_CONTROL_OCTET:-240}.4
        command: bash -c "
                    service ssh start &&
                    tail -f /dev/null"
        restart: unless-stopped
        volumes:
            - ./in-vitro/access_control/vm4/flag:/root/flag

# Network definition
networks:
    net-main_network:
        internal: true
        ipam:
            config:
                - subnet: ${BENCHMARK_PREFIX:-192.168}.0.0/16