version: "3"

# Pentest workstation with Kali
services:
    kali_master:
        security_opt:
            - label:disable
        build: ./kali
        image: kali
        hostname: kali_master
        container_name: kali_master
        networks:
            net-main_network:
                # Kali is where every run starts: the harness reaches it from
                # the host, and all target traffic is tunnelled through it.
                # Keep it out of the 192.168.0.0/24 slice, because that is the
                # range most home routers hand out -- when the host's LAN uses
                # it, the host's more specific /24 route wins over this
                # bridge's /16 and Kali becomes unreachable from the host.
                # Override with KALI_IP to move it somewhere else.
                ipv4_address: ${KALI_IP:-192.168.254.5}
        volumes:
            - ./kali/tmp_script:/root/scripts
        command: bash -c "
                    service ssh start &&
                    tail -f /dev/null"
                    
# Network configuration
networks:
    net-main_network:
        # Keep vulnerable benchmark services isolated from the host network.
        internal: true
        ipam:
            config:
                - subnet: ${BENCHMARK_PREFIX:-192.168}.0.0/16