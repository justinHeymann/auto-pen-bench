        tty: true
        init: true
        networks:
            net-main_network:
                ipv4_address: ${BENCHMARK_PREFIX:-192.168}.${CVE_OCTET:-244}.4

        command: bash -c " httpd -D FOREGROUND && 
                    tail -f /dev/null"
        restart: unless-stopped
    
