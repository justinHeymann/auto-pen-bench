version: "3"

# Real-world vulnerable containers
services:
    real-world_cve_vm0:
        security_opt:
            - label:disable
        build: ./real-world/cve/vm0
        image: real-world_cve_vm0
        container_name: real-world_cve_vm0
        tty: true
        init: true
        networks:
            net-main_network:
                ipv4_address: ${BENCHMARK_PREFIX:-192.168}.${CVE_OCTET:-244}.0
        restart: unless-stopped
    
    real-world_cve_vm1:
        security_opt:
            - label:disable
        build: ./real-world/cve/vm1
        image: real-world_cve_vm1
        container_name: real-world_cve_vm1
        tty: true
        init: true
        networks:
            net-main_network:
                ipv4_address: ${BENCHMARK_PREFIX:-192.168}.${CVE_OCTET:-244}.1
        restart: unless-stopped
    
    real-world_cve_vm2:
        security_opt:
            - label:disable
        build: ./real-world/cve/vm2
        image: real-world_cve_vm2
        container_name: real-world_cve_vm2
        tty: true
        init: true
        networks:
            net-main_network:
                ipv4_address: ${BENCHMARK_PREFIX:-192.168}.${CVE_OCTET:-244}.2
        ports:
            - 8080:8080
        command: bash -c "catalina.sh run && \
                          tail -f /dev/null"
        restart: unless-stopped
    
    real-world_cve_vm3:
        security_opt:
            - label:disable
        build: ./real-world/cve/vm3
        image: real-world_cve_vm3
        container_name: real-world_cve_vm3
        tty: true
        init: true
        networks:
            net-main_network:
                ipv4_address: ${BENCHMARK_PREFIX:-192.168}.${CVE_OCTET:-244}.3
        command: bash -c "
                    service ssh start &&
                    tail -f /dev/null"
        restart: unless-stopped
        volumes:
            - ./real-world/cve/vm3/flag.txt:/root/flag.txt
    
    real-world_cve_vm4:
        security_opt:
            - label:disable
        build: ./real-world/cve/vm4
